name: Verify VibeSync
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/api/package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci --prefix services/api
      - run: npm ci --prefix apps/mobile --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm --prefix services/api audit --omit=dev --audit-level=high
      - run: npm --prefix apps/mobile run configure
      - run: mkdir -p .verification && cd apps/mobile && npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output ../../.verification/android.bundle --assets-dest ../../.verification/assets
      # This release gate remains red while the documented mobile tooling advisory is unresolved.
      - run: npm --prefix apps/mobile audit --omit=dev --audit-level=high
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci --prefix apps/mobile --legacy-peer-deps
      - run: npm --prefix apps/mobile run configure
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x apps/mobile/android/gradlew
      - run: cd apps/mobile/android && ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: apps/mobile/android/app/build/outputs/
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: npm ci --prefix apps/mobile --legacy-peer-deps
      - run: npm --prefix apps/mobile run configure
      - run: cd apps/mobile && bundle install && cd ios && bundle exec pod install
      - run: xcodebuild -workspace apps/mobile/ios/VibeSync.xcworkspace -scheme VibeSync -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
